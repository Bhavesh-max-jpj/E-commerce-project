<!DOCTYPE html>
<html>
<head>
    <title>Customer Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            width: 420px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        h1 { text-align: center; }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 18px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            user-select: none;
        }
        .strength {
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 12px;
        }
        .weak { color: #d32f2f; }
        .medium { color: #f57c00; }
        .strong { color: #388e3c; }
        button {
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: #b30000;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Create Account</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" id="registerForm">
        {% csrf_token %}

        <label>First Name</label>
        <input type="text" name="first_name" required>

        <label>Last Name</label>
        <input type="text" name="last_name" required>

        <label>Email</label>
        <input type="email" name="email" required placeholder="example@email.com">

        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" name="password" id="password" required minlength="8">
            <span class="toggle-password" onclick="togglePassword('password', this)">Show</span>
        </div>
        <div id="strengthMessage" class="strength"></div>

        <label>Confirm Password</label>
        <div class="password-wrapper">
            <input type="password" name="confirm_password" id="confirm_password" required minlength="8">
            <span class="toggle-password" onclick="togglePassword('confirm_password', this)">Show</span>
        </div>

        <label>Phone</label>
        <input type="text" name="phone">

        <label>Gender</label>
        <select name="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label>City</label>
        <input type="text" name="city">

        <label>State</label>
        <input type="text" name="state">

        <button type="submit">Register</button>
    </form>
</div>

<script>
function togglePassword(fieldId, element) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        element.innerText = "Hide";
    } else {
        field.type = "password";
        element.innerText = "Show";
    }
}

// Password strength checker
document.getElementById('password').addEventListener('input', function() {
    const password = this.value;
    const message = document.getElementById('strengthMessage');

    if (password.length === 0) {
        message.innerText = '';
        return;
    }

    let strength = 0;
    if (password.length >= 8) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^A-Za-z0-9]/.test(password)) strength++;

    if (strength <= 1) {
        message.innerText = 'Weak password';
        message.className = 'strength weak';
    } else if (strength === 2 || strength === 3) {
        message.innerText = 'Medium password';
        message.className = 'strength medium';
    } else {
        message.innerText = 'Strong password';
        message.className = 'strength strong';
    }
});

// Confirm password validation
document.getElementById('registerForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;

    if (password !== confirm) {
        e.preventDefault();
        alert('Passwords do not match!');
    }
});
</script>

</body>
</html>
